<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Controllo Agente Ristorante</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; margin: 0; }
    .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { color: #dc2626; font-size: 1.4rem; margin: 0 0 5px 0; }
    h2 { font-size: 1rem; margin-top: 0; color: #111; }
    .status { font-size: 0.8rem; color: #16a34a; font-weight: bold; margin-bottom: 15px; display: block; }
    button { background: #dc2626; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 0.9rem; }
    .btn-dark { background: #1f2937; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
    label { font-size: 0.85rem; font-weight: 600; color: #4b5563; }
    .checkbox-container { display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>

  <h1>🤖 Marketing Agent</h1>
  <span class="status">● Agente Online</span>

  <div class="card">
    <h2>1. Frequenza Social Settimanale</h2>
    <div style="margin-bottom: 10px;">
      <label>Reels / TikTok a settimana:</label>
      <input type="number" id="reelsCount" value="2">
    </div>
    <div>
      <label>Storie Meta a settimana:</label>
      <input type="number" id="storiesCount" value="4">
    </div>
  </div>

  <div class="card">
    <h2>2. Impostazioni Chatbot Meta</h2>
    <div class="checkbox-container" style="margin-bottom: 12px;">
      <label for="proposeMenuToggle">Proponi Menu in Chat</label>
      <input type="checkbox" id="proposeMenuToggle" checked style="width: 20px; height: 20px;">
    </div>
    <div>
      <label for="waNumberInput">Numero WhatsApp (Riservazioni / Preventivi):</label>
      <input type="text" id="waNumberInput" value="+393331234567">
    </div>
    <button onclick="saveBotSettings()" style="margin-top: 15px;">Salva Impostazioni Bot</button>
  </div>

  <div class="card">
    <h2>3. Archivio Google Drive</h2>
    <button class="btn-dark" onclick="handleUpload()">📁 Carica Foto / Video su Drive</button>
  </div>

  <div class="card" id="approvalCard">
    <h2>4. Post da Approvare</h2>
    <p style="font-size: 0.85rem; color: #555; background: #f9fafb; padding: 10px; border-radius: 6px;">"Il nostro piatto speciale della settimana ti aspetta. Vieni a provarlo stasera!"</p>
    <div style="display: flex; gap: 10px;">
      <button onclick="approve(true)" style="background: #16a34a;">Approva</button>
      <button onclick="approve(false)" style="background: #9ca3af;">Scarta</button>
    </div>
  </div>

  <!-- Collegamento essenziale al file JS -->
  <script src="app.js"></script>
  
  <script>
    // Registrazione Service Worker per installazione PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
